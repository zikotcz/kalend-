<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kalendář</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="card wide hidden" id="app">
    <div class="topbar">
      <h1>📅 Kalendář</h1>
      <div>
        <a id="admin-link" class="hidden" href="admin.html">Správa uživatelů</a>
        <button class="link-btn" id="logout">Odhlásit</button>
      </div>
    </div>
    <p>Vítejte, <strong id="who"></strong>. Máte schválený přístup.</p>
    <!-- Sem přijde samotný obsah kalendáře -->
  </main>

  <script type="module">
    import { auth, db, logout, isAdmin, onAuthStateChanged, doc, onSnapshot } from "./firebase.js";

    document.getElementById("logout").onclick = async () => { await logout(); location.href = "index.html"; };

    onAuthStateChanged(auth, (user) => {
      if (!user) return (location.href = "index.html");
      const show = () => {
        document.getElementById("who").textContent = user.displayName || user.email;
        document.getElementById("admin-link").classList.toggle("hidden", !isAdmin(user));
        document.getElementById("app").classList.remove("hidden");
      };
      if (isAdmin(user)) return show();
      // Hlídáme stav živě – při odebrání přístupu uživatele hned vrátíme na přihlášení.
      onSnapshot(doc(db, "users", user.uid), (snap) => {
        if (snap.data()?.status === "approved") show();
        else location.href = "index.html";
      }, () => (location.href = "index.html"));
    });
  </script>
</body>
</html>
